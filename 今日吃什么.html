<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="今日吃什么"><title>今日吃什么</title><style>
:root{font-family:'HarmonyOS Sans SC','HarmonyOS Sans','PingFang SC','Microsoft YaHei',sans-serif;color:#191919;background:white;font-weight:400}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.app{max-width:480px;margin:auto;height:100dvh;display:flex;flex-direction:column;background:white}.page{min-height:0;flex:1;overflow:auto;padding:calc(env(safe-area-inset-top) + 28px) 20px 30px;scrollbar-width:none}.page::-webkit-scrollbar{display:none}.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid #eee;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.nav button{border:0;background:white;color:#aaa;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px}.nav button.active{color:#151515;font-weight:600}.nav svg{height:22px;width:22px}h1{font-size:28px;letter-spacing:-.8px;font-weight:500;margin:4px 0}h2{font-size:17px;font-weight:500;margin:0}.caps{font-size:10px;letter-spacing:2px;color:#aaa}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.muted{color:#999;font-size:11px}.round{border:0;border-radius:50%;width:40px;height:40px;background:#f5f5f5;font-size:22px}.hero{background:#f7f7f7;border-radius:23px;padding:21px 17px;text-align:center}.hero-emoji{font-size:45px;margin:17px 0}.hero h2{font-size:16px;margin-bottom:7px}.actions{display:flex;gap:9px;margin-top:15px}.btn{background:#1a1a1a;color:white;border:0;border-radius:24px;padding:12px 15px;font-size:12px}.btn.secondary{background:#f1f1f1;color:#222}.btn.outline{background:white;border:1px solid #e6e6e6;color:#222}.actions .btn{flex:1}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}.tag{background:#f4f4f4;color:#888;border-radius:20px;padding:6px 10px;font-size:10px}.day{display:flex;gap:13px;align-items:center;padding:12px;border:1px solid #efefef;border-radius:19px;margin-bottom:9px}.food{width:68px;height:65px;flex:none;background:#f7f7f7;border-radius:15px;display:grid;place-items:center;font-size:33px}.day-label{font-size:10px;letter-spacing:.5px;color:#aaa}.day-title{font-size:13px;font-weight:500;margin:4px 0}.day-sub{font-size:11px;color:#aaa}.filterbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:16px -20px;padding:0 20px}.filterbar button{border-radius:20px;background:white;border:1px solid #eaeaea;font-size:11px;padding:9px 12px;white-space:nowrap}.filterbar .on{background:#1b1b1b;color:white;border-color:#1b1b1b}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.dish{padding:0;border:1px solid #eee;border-radius:18px;overflow:hidden;background:white;text-align:left;position:relative}.dish.chosen{border-color:#111}.dish-image{height:97px;background:#f7f7f7;display:grid;place-items:center;font-size:43px}.dish-body{padding:11px}.dish-body strong{font-size:12px;font-weight:500;display:block}.dish-body small{font-size:10px;color:#aaa}.mark{position:absolute;top:8px;right:8px;background:#222;border-radius:50%;color:white;width:22px;height:22px;display:grid;place-items:center;font-size:12px}.action-sticky{position:sticky;bottom:0;margin-top:15px;background:#fffefa;padding:12px;border:1px solid #eee;border-radius:18px;box-shadow:0 5px 20px #0000000c}.shopgroup{background:#f7f7f7;border-radius:20px;padding:16px;margin-bottom:11px}.shopitem{width:100%;display:flex;align-items:center;gap:11px;border:none;border-bottom:1px solid #e9e9e9;text-align:left;background:none;padding:12px 0;font-size:12px}.shopitem:last-child{border:0}.shopitem.checked{color:#aaa;text-decoration:line-through}.check{width:19px;height:19px;display:grid;place-items:center;border:1px solid #ccc;border-radius:50%;background:white;flex:none}.shopitem.checked .check{background:#222;color:white;border-color:#222}.weeknav{display:flex;align-items:center;justify-content:space-between}.weeknav button{border:0;background:#f4f4f4;border-radius:50%;width:37px;height:37px;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:20px 0}.calday{text-align:center;background:#f7f7f7;border-radius:12px;padding:10px 0;min-height:59px;font-size:12px}.calday.has{background:#e9f1e4}.calday.today{background:#222;color:white}.stats{background:#f7f7f7;border-radius:20px;padding:19px}.statsrow{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:16px}.statsrow strong{font-size:23px;font-weight:500;display:block}.empty{text-align:center;color:#aaa;font-size:12px;padding:35px 5px;line-height:1.8}.overlay{position:fixed;inset:0;z-index:10;background:#0006;display:flex;align-items:end;justify-content:center}.sheet{max-width:480px;width:100%;background:white;border-radius:24px 24px 0 0;max-height:88dvh;overflow:auto;padding:24px 20px calc(30px + env(safe-area-inset-bottom))}.formrow{margin-bottom:13px}.formrow label{display:block;font-size:12px;margin-bottom:6px}.formrow input,.formrow select{width:100%;background:#f9f9f9;border:1px solid #e8e8e8;border-radius:12px;padding:12px;outline:none;font-size:13px}.manage-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #eee;font-size:12px}.tiny{background:#f2f2f2;border:0;border-radius:12px;padding:8px;font-size:11px}.tiny.delete{color:#ae5050}.toast{position:fixed;z-index:15;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:30px;background:#222;color:white;white-space:nowrap;font-size:12px;padding:11px 16px}.note{color:#888;font-size:11px;line-height:1.7;background:#f7f7f7;border-radius:15px;padding:13px;margin:16px 0}@media(min-width:600px){body{background:#f4f4f4}.app{box-shadow:0 8px 40px #00000010}}
</style></head><body><div class="app"><main id="content" class="page"></main><nav id="nav" class="nav"></nav></div><div id="modal"></div><div id="toast"></div><script>
(()=>{
const seed=[
['腊肠煲仔饭','主食','🍚','腊肠,米饭'],['红三剁','猪肉','🍅','猪肉末,番茄,青椒'],['黄焖鸡','鸡肉','🍗','鸡腿肉,香菇'],['咖喱鸡','鸡肉','🍛','鸡腿肉,土豆,咖喱块'],['包浆豆腐','豆蛋','🍢','豆腐'],['西红柿炒蛋','豆蛋','🍅','番茄,鸡蛋'],['清炒白菜','素菜','🥬','白菜'],['清炒西葫芦','素菜','🥒','西葫芦'],['扁豆炒腊肉','猪肉','🥓','扁豆,腊肉'],['孜然洋葱炒牛肉','牛肉','🥩','牛肉,洋葱'],['咖喱牛肉','牛肉','🍛','牛肉,土豆,咖喱块'],['卤牛肉','牛肉','🥩','牛肉,卤料'],['辣椒炒肉','猪肉','🌶️','猪肉片,青椒'],['红烧大排','猪肉','🍖','猪大排'],['毛豆鸡','鸡肉','🫛','鸡丁,毛豆'],['椒麻鸡','鸡肉','🍗','鸡腿肉,花椒'],['毛豆炒鸡丁','鸡肉','🍗','鸡丁,毛豆'],['青椒炒百叶','豆蛋','🫑','百叶,青椒'],['卤肉卷','主食','🌯','卤肉,饼皮'],['老北京鸡肉卷','主食','🌯','鸡肉,饼皮,黄瓜'],['越南米卷','主食','🥬','米纸,黄瓜,胡萝卜'],['凉拌拍黄瓜','素菜','🥒','黄瓜'],['火烧云土豆焖鸡','鸡肉','🥔','鸡腿肉,土豆'],['芋儿鸡（辣）','鸡肉','🍲','鸡肉,芋头'],['卤猪舌（凉）','猪肉','🍖','猪舌,卤料'],['清炒西蓝花','素菜','🥦','西蓝花'],['打抛猪肉','猪肉','🍚','猪肉末,罗勒'],['蒜香烤排骨','猪肉','🍖','猪排骨'],['红烧肉','猪肉','🥘','五花肉'],['罗勒西红柿意大利面','主食','🍝','意大利面,番茄,罗勒'],['蒜香虾意大利面','主食','🍤','意大利面,虾仁'],['煎饺','主食','🥟','速冻饺子'],['宫保鸡丁','鸡肉','🍗','鸡丁,花生'],['黑椒鸡腿肉','鸡肉','🍗','鸡腿肉,黑胡椒'],['洋葱炒鸡丁','鸡肉','🧅','鸡丁,洋葱'],['青椒肉丝','猪肉','🌶️','猪肉丝,青椒'],['土豆烧排骨','猪肉','🥔','猪排骨,土豆'],['肉末豆角','猪肉','🫛','猪肉末,豆角'],['黑椒土豆牛肉','牛肉','🥩','牛肉,土豆'],['番茄炖牛肉','牛肉','🍅','牛肉,番茄'],['蒜蓉虾仁西蓝花','海鲜','🍤','虾仁,西蓝花'],['虾仁炒蛋','海鲜','🍳','虾仁,鸡蛋'],['麻婆豆腐','豆蛋','🍲','豆腐,豆瓣酱'],['香干炒青椒','豆蛋','🫑','香干,青椒'],['鸡蛋炒西葫芦','豆蛋','🍳','鸡蛋,西葫芦'],['蛋炒饭','主食','🍳','米饭,鸡蛋'],['咖喱鸡肉饭','主食','🍛','米饭,鸡丁,咖喱块'],['蒜蓉生菜','素菜','🥬','生菜'],['手撕包菜','素菜','🥬','包菜'],['香菇青菜','素菜','🥬','上海青,香菇']].map((a,i)=>({id:'d'+i,name:a[0],category:a[1],emoji:a[2],ingredients:a[3].split(',')}));
const STORE='today-meals-html-v1';let state={dishes:seed,weeks:{},checked:{},selected:[],tab:'home',filter:'全部',offset:0,manage:false,edit:null};try{const x=JSON.parse(localStorage.getItem(STORE));if(x)state={...state,...x,manage:false,edit:null,tab:'home'}}catch(e){};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}};
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const byId=id=>state.dishes.find(d=>d.id===id);
const monday=offset=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d};
const weekKey=offset=>{const d=monday(offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const current=()=>state.weeks[weekKey(0)]||[];
const rand=a=>a[Math.floor(Math.random()*a.length)];const mix=a=>[...a].sort(()=>Math.random()-.5);
const mainType=d=>d.category==='主食'?(d.ingredients.some(x=>/鸡/.test(x))?'鸡肉':d.ingredients.some(x=>/牛/.test(x))?'牛肉':d.ingredients.some(x=>/猪|肉|腊/.test(x))?'猪肉':'主食'):d.category;
const head=(en,title,right='')=>`<header class="head"><div><div class="caps">${en}</div><h1>${title}</h1></div>${right}</header>`;
const mealCards=meals=>meals.map((x,i)=>{const m=x.mainSnapshot||byId(x.main),s=x.sideSnapshot||byId(x.side);return `<div class="day"><div class="food">${esc(m?.emoji||'🍽️')}</div><div style="min-width:0;flex:1"><div class="day-label">${['MON','TUE','WED','THU'][i]} / ${['周一','周二','周三','周四'][i]}</div><div class="day-title">${esc(m?.name||'未安排')}</div><div class="day-sub">${esc(s?.name||'自由搭配')}</div></div>${s?`<span style="font-size:22px">${esc(s.emoji)}</span>`:''}</div>`}).join('');
function makeMeal(m,s){return {main:m.id,side:s?.id||null,mainSnapshot:{...m},sideSnapshot:s?{...s}:null}}
function generate(){const main=state.dishes.filter(d=>d.category!=='素菜'&&!/冷|凉|米卷/.test(d.name));const sides=state.dishes.filter(d=>d.category==='素菜');if(main.length<4||sides.length<1){notice('请先添加更多菜品');return}const groups={};main.forEach(d=>(groups[mainType(d)]??=[]).push(d));const types=mix(Object.keys(groups).filter(t=>groups[t].length>=2));let chosen=types.length>=2?[...mix(groups[types[0]]).slice(0,2),...mix(groups[types[1]]).slice(0,2)]:mix(main).slice(0,4);const sideChoice=mix(sides).slice(0,2);state.weeks[weekKey(0)]=chosen.map((m,i)=>makeMeal(m,sideChoice[i%sideChoice.length]));state.checked[weekKey(0)]={};save();render();notice('本周菜单已生成')}
function home(){const arr=current();return head('WEEKLY MENU','这一周，吃什么？','<button class="round" data-act="generate">↻</button>')+`<div class="hero"><div class="caps">TODAY'S MEAL</div><div class="hero-emoji">🍚 🥬 🍗</div><h2>少买一点，好好吃饭。</h2><div class="muted">周一至周四 · 一天一餐 · 简单带饭</div><div class="actions"><button class="btn" data-act="generate">↻ 随机生成</button><button class="btn outline" data-act="picktab">♡ 自己选菜</button></div></div><div class="section"><h2>本周菜单</h2><span class="tag">MON — THU</span></div>${arr.length?mealCards(arr):'<div class="empty">还没有菜单，生成一份吧 🍽️</div>'}<div class="actions"><button class="btn secondary" data-act="shoptab">采购清单 ↗</button><button class="btn secondary" data-act="historytab">周历回顾 ↗</button></div>`}
function pick(){const cats=['全部','鸡肉','猪肉','牛肉','海鲜','豆蛋','主食','素菜'];const list=state.dishes.filter(d=>state.filter==='全部'||d.category===state.filter);const count=state.selected.map(byId).filter(d=>d&&d.category!=='素菜').length;return head('MY COOKBOOK','自选菜谱','<button class="btn secondary" data-act="manage">＋ 管理</button>')+`<div class="muted">选择四道主菜，也可以额外选择喜欢的素菜。</div><div class="filterbar">${cats.map(c=>`<button data-filter="${c}" class="${state.filter===c?'on':''}">${c}</button>`).join('')}</div><div class="cards">${list.map(d=>`<button class="dish ${state.selected.includes(d.id)?'chosen':''}" data-act="select" data-id="${esc(d.id)}"><div class="dish-image">${esc(d.emoji)}</div><div class="dish-body"><strong>${esc(d.name)}</strong><small>${esc(d.category)} · ${d.ingredients.length} 种食材</small></div>${state.selected.includes(d.id)?'<span class="mark">✓</span>':''}</button>`).join('')}</div><div class="action-sticky"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px"><span>已选 ${count} / 4 道主菜</span><button class="tiny" data-act="clear">清空</button></div><button class="btn" style="width:100%" data-act="arrange" ${count!==4?'disabled':''}>✦ 智能安排这一周 →</button></div>`}
function arrange(){const chosen=state.selected.map(byId).filter(Boolean),mains=chosen.filter(d=>d.category!=='素菜').sort((a,b)=>mainType(a).localeCompare(mainType(b),'zh')),sides=chosen.filter(d=>d.category==='素菜');if(mains.length!==4)return;const sideChoices=sides.length?sides:state.dishes.filter(d=>d.category==='素菜').slice(0,2);state.weeks[weekKey(0)]=mains.map((m,i)=>makeMeal(m,sideChoices[i%sideChoices.length]));state.checked[weekKey(0)]={};state.selected=[];state.tab='home';save();render();notice('已安排本周菜单')}
function ingredients(meals){const c={};meals.forEach(meal=>[meal.mainSnapshot||byId(meal.main),meal.sideSnapshot||byId(meal.side)].filter(Boolean).forEach(d=>d.ingredients.forEach(ing=>c[ing]=(c[ing]||0)+1)));return c}
function shop(){const counts=ingredients(current()),checked=state.checked[weekKey(0)]||{};const meat=x=>/鸡|猪|牛|虾|肉|排骨|腊/.test(x);const veg=x=>/菜|瓜|番茄|青椒|毛豆|土豆|洋葱|香菇|豆角|芋头|罗勒|萝卜/.test(x)&&!meat(x);const groups=[['肉类与蛋白',meat],['新鲜蔬菜',veg],['主食与其他',x=>!meat(x)&&!veg(x)]];const done=Object.keys(counts).filter(k=>checked[k]).length;return head('SHOPPING LIST','本周采购','<button class="round" data-act="resetchecks">↺</button>')+`<div class="hero"><div class="hero-emoji">🛒 🥬 🥩</div><h2>一次买齐，四天不愁。</h2><div class="muted">${done} / ${Object.keys(counts).length} 项已购买</div></div><div style="height:22px"></div>${groups.map(([name,test],i)=>`<div class="shopgroup"><div class="caps">0${i+1} / ${name}</div>${Object.entries(counts).filter(([n])=>test(n)).map(([n,c])=>`<button class="shopitem ${checked[n]?'checked':''}" data-act="check" data-name="${esc(n)}"><span class="check">${checked[n]?'✓':''}</span><span style="flex:1">${esc(n)}</span><span class="muted">${c>1?'× '+c+' 餐':''}</span></button>`).join('')||'<div class="muted" style="padding:16px 0">暂无</div>'}</div>`).join('')}<button class="btn" style="width:100%;margin-top:7px" data-act="copy">复制采购清单</button>`}
function history(){const start=monday(state.offset),end=new Date(start);end.setDate(start.getDate()+6);const fmt=d=>`${d.getMonth()+1}.${d.getDate()}`;const meals=state.weeks[weekKey(state.offset)]||[];const types=new Set(meals.map(x=>mainType(x.mainSnapshot||byId(x.main)||{category:'其他',ingredients:[]})));return head('WEEKLY ARCHIVE','每周回顾')+`<div class="weeknav"><button data-act="prev">‹</button><div style="text-align:center"><h2>${fmt(start)} — ${fmt(end)}</h2><div class="caps">${start.getFullYear()} · WEEKLY CALENDAR</div></div><button data-act="next">›</button></div><div class="calendar">${['一','二','三','四','五','六','日'].map((n,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const today=new Date();return `<div class="calday ${i<meals.length?'has':''} ${d.toDateString()===today.toDateString()?'today':''}"><div class="muted" style="color:inherit">${n}</div>${d.getDate()}${i<meals.length?'<div style="font-size:9px">●</div>':''}</div>`}).join('')}</div><div class="stats"><div class="caps">WEEK IN REVIEW</div><div class="statsrow"><div><strong>${meals.length}</strong><span class="muted">计划餐数</span></div><div><strong>${meals.length?types.size:0}</strong><span class="muted">主菜类型</span></div><div><strong>${Object.keys(ingredients(meals)).length}</strong><span class="muted">食材种类</span></div></div></div><div class="section"><h2>这一周的餐桌</h2><span class="tag">${meals.length?'已记录':'未安排'}</span></div>${meals.length?mealCards(meals):'<div class="empty">这一周还没有菜单 🍚</div>'}${state.offset!==0?'<button class="btn secondary" style="width:100%" data-act="thisweek">回到本周</button>':''}`}
function manage(){const d=byId(state.edit);return `<div class="overlay"><div class="sheet"><div class="head"><div><div class="caps">RECIPE LIBRARY</div><h2 style="margin-top:7px">管理菜谱 · ${state.dishes.length}</h2></div><button class="round" data-act="close">×</button></div><form id="dish-form"><div class="formrow"><label>菜名</label><input name="name" required maxlength="36" placeholder="例如：蒜香鸡腿肉" value="${esc(d?.name||'')}"></div><div class="formrow"><label>分类</label><select name="category">${['鸡肉','猪肉','牛肉','海鲜','豆蛋','主食','素菜'].map(c=>`<option ${d?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="formrow"><label>Emoji 插图</label><input name="emoji" maxlength="8" placeholder="🍗" value="${esc(d?.emoji||'🍽️')}"></div><div class="formrow"><label>所需食材</label><input name="ingredients" required placeholder="鸡腿肉，洋葱，土豆" value="${esc(d?.ingredients.join('，')||'')}"></div><div class="actions"><button class="btn" type="submit">${d?'保存修改':'＋ 添加菜谱'}</button>${d?'<button class="btn secondary" type="button" data-act="cancel-edit">取消</button>':''}</div></form><div class="section"><h2>全部菜品</h2></div>${state.dishes.map(d=>`<div class="manage-item"><span style="font-size:27px">${esc(d.emoji)}</span><span style="flex:1">${esc(d.name)}<span class="muted" style="display:block">${esc(d.category)}</span></span><button class="tiny" data-act="edit" data-id="${esc(d.id)}">编辑</button><button class="tiny delete" data-act="delete" data-id="${esc(d.id)}">删除</button></div>`).join('')}</div></div>`}
const paths={home:'<path d="M3 9 12 2l9 7v11H3z"/><path d="M9 20v-7h6v7"/>',pick:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',shop:'<path d="M3 4h2l3 12h11l2-9H6M9 21h.01M18 21h.01"/>',history:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18M8 14h3M8 18h3"/>'};
function render(){document.getElementById('content').innerHTML=({home,pick,shop,history})[state.tab]();document.getElementById('nav').innerHTML=[['home','本周'],['pick','自选'],['shop','采购'],['history','周历']].map(([id,name])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${paths[id]}</svg>${name}</button>`).join('');document.getElementById('modal').innerHTML=state.manage?manage():''}
let toastTimer;function notice(txt){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(txt)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.innerHTML='',2100)}
document.addEventListener('submit',e=>{if(e.target.id!=='dish-form')return;e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')).trim(),ingredients=String(f.get('ingredients')).split(/[,，、]/).map(s=>s.trim()).filter(Boolean);if(!name||!ingredients.length)return;const obj={id:state.edit||'user-'+Date.now(),name,category:String(f.get('category')),emoji:String(f.get('emoji')).trim()||'🍽️',ingredients};if(state.edit){const ix=state.dishes.findIndex(d=>d.id===state.edit);if(ix>=0)state.dishes[ix]=obj}else state.dishes.push(obj);state.edit=null;save();render();notice('已保存菜谱')});
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.manage=false;save();render();document.getElementById('content').scrollTop=0;return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='generate')generate();if(['picktab','shoptab','historytab'].includes(a)){state.tab={picktab:'pick',shoptab:'shop',historytab:'history'}[a];save();render()}if(a==='select'){const id=b.dataset.id;state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];save();render()}if(a==='clear'){state.selected=[];save();render()}if(a==='arrange')arrange();if(a==='manage'){state.manage=true;state.edit=null;render()}if(a==='close'){state.manage=false;state.edit=null;render()}if(a==='edit'){state.edit=b.dataset.id;render();document.querySelector('.sheet').scrollTop=0}if(a==='cancel-edit'){state.edit=null;render()}if(a==='delete'){const d=byId(b.dataset.id);if(!d||!confirm(`确定删除「${d.name}」吗？`))return;state.dishes=state.dishes.filter(x=>x.id!==d.id);state.selected=state.selected.filter(x=>x!==d.id);state.edit=null;save();render();notice('已删除')}if(a==='check'){const c=state.checked[weekKey(0)]||(state.checked[weekKey(0)]={});c[b.dataset.name]=!c[b.dataset.name];save();render()}if(a==='resetchecks'){state.checked[weekKey(0)]={};save();render()}if(a==='prev'){state.offset--;save();render()}if(a==='next'){state.offset++;save();render()}if(a==='thisweek'){state.offset=0;save();render()}if(a==='copy'){const items=Object.keys(ingredients(current()));const str='本周采购清单\n'+items.map(x=>'□ '+x).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(str).then(()=>notice('采购清单已复制')).catch(()=>notice('复制失败'));else{const t=document.createElement('textarea');t.value=str;document.body.appendChild(t);t.select();try{document.execCommand('copy');notice('采购清单已复制')}catch(e){notice('复制失败')}t.remove()}}});
render();
})();
</script></body></html>
